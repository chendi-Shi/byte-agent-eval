name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: byte-agent-eval
      - uses: actions/checkout@v4
        with:
          repository: chendi-Shi/byte-agent-platform
          ref: bed2629c1d166986bea73a13afa7e8fe669a642b
          path: byte-agent-platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e byte-agent-eval
      - run: python -m unittest discover -s tests -v
        working-directory: byte-agent-eval
      - run: python -m byte_eval run --fixture
        working-directory: byte-agent-eval
      - run: python -m byte_eval report --include-fixtures
        working-directory: byte-agent-eval
      - run: python -m byte_eval export-sft
        working-directory: byte-agent-eval
  training-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: byte-agent-eval
      - uses: actions/checkout@v4
        with:
          repository: chendi-Shi/byte-agent-platform
          ref: bed2629c1d166986bea73a13afa7e8fe669a642b
          path: byte-agent-platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Install verified training dependencies and projects
        run: python -m pip install -r byte-agent-eval/requirements-training.txt -r byte-agent-eval/requirements-training-lock.txt -e byte-agent-platform -e byte-agent-eval
      - name: Run actual tool/data/provenance contracts
        run: python -m unittest discover -s tests -p test_training.py -v
        working-directory: byte-agent-eval
      - name: Run actual LoRA autograd and adapter round-trip contracts
        run: python -m unittest discover -s tests -p test_training_policy.py -v
        working-directory: byte-agent-eval
