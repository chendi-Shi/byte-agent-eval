[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byte-agent-eval"
version = "0.2.0"
description = "Auditable agent evaluation and SFT trajectory export"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
byte-eval = "byte_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
