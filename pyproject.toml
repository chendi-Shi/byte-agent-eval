[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byte-agent-eval"
version = "0.3.0"
description = "Auditable agent evaluation and SFT trajectory export"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
training = ["torch>=2.5,<3", "transformers>=4.57,<5", "peft>=0.14,<1", "accelerate>=1.2,<2", "safetensors>=0.4,<1", "huggingface-hub>=0.28,<1"]

[project.scripts]
byte-eval = "byte_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
